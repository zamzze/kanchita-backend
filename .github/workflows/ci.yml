name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 20 / PostgreSQL 15
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: kanchita_ci
          POSTGRES_PASSWORD: kanchita_ci_password
          POSTGRES_DB: kanchita_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kanchita_ci -d kanchita_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      NODE_ENV: test
      PORT: 3000
      TEST_DB_URL: postgresql://kanchita_ci:kanchita_ci_password@127.0.0.1:5432/kanchita_ci
      DB_URL: postgresql://kanchita_ci:kanchita_ci_password@127.0.0.1:5432/kanchita_ci
      JWT_SECRET: ci-only-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production
      TMDB_API_KEY: ci-only-placeholder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify dependency tree
        run: npm ls --depth=0

      - name: Run smoke and database tests
        run: npm test

      - name: Run PostgreSQL integration tests explicitly
        run: npm run test:db

      - name: Run auth session integration tests explicitly
        run: npm run test:auth

      - name: Run stream lifecycle integration tests explicitly
        run: npm run test:streams

      - name: Check changed whitespace
        run: git diff --check HEAD^ HEAD

      - name: Check JavaScript syntax
        run: find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Audit dependencies (informational)
        continue-on-error: true
        run: npm audit
